# One-click deploy to Render: https://render.com/deploy?repo=https://github.com/kbaker827/bl2u1
services:
  - type: web
    name: bl2u1
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Password for the Library tab. Render generates a random value on first
      # deploy; find it (or replace it) under Environment in the Render dashboard.
      - key: ADMIN_TOKEN
        generateValue: true
      # Render's load balancer adds the visitor's IP to X-Forwarded-For; trust
      # one hop so per-visitor upload limits see real IPs, not the proxy's.
      - key: TRUST_PROXY_HOPS
        value: "1"
