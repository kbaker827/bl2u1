name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=. --cov-report=term-missing --cov-fail-under=80

  css:
    # static/css/app.css is committed so the server needs no Node.js.
    # Fail if someone changed templates/ without rebuilding it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - run: git diff --exit-code static/css/app.css || (echo "::error::static/css/app.css is out of date. Run 'npm run build:css' and commit the result." && exit 1)
