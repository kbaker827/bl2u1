services:
  bl2u1:
    build: .
    container_name: bl2u1
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
      - inventory:/app/inventory
    environment:
      - FLASK_DEBUG=false
      # Set a password to protect the Library tab (recommended if the
      # server is reachable by other people). Leave empty for no password.
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      # Set to false to hide the Library tab entirely.
      - LIBRARY_ENABLED=${LIBRARY_ENABLED:-true}

volumes:
  uploads:
  inventory:
